<section id="about">
  <h2 class="section-title">About Me</h2>
  <div class="about-content">
    <div class="about-text">
      <p class="summary">{{ summary }}</p>
      <div class="highlights">
        <h3>Key Achievements</h3>
        <ul>
          @for (highlight of highlights; track highlight) {
            <li>{{ highlight }}</li>
          }
        </ul>
      </div>
    </div>
  </div>
</section>
